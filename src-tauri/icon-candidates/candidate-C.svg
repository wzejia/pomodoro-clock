<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a38"/>
      <stop offset="1" stop-color="#ee3320"/>
    </linearGradient>
    <filter id="longshadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- 长软投影（斜向 45°，极简徽章感） -->
  <g transform="translate(36,44)" opacity="0.22" filter="url(#longshadow)">
    <circle cx="512" cy="512" r="280" fill="none" stroke="#7a1208" stroke-width="42"/>
    <line x1="512" y1="512" x2="657" y2="657" stroke="#7a1208" stroke-width="42" stroke-linecap="round"/>
  </g>
  <!-- 单环 + 单针指向 25 分位（番茄=25 分钟的几何暗喻） -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="#ffffff" stroke-width="42"/>
  <line x1="512" y1="512" x2="657" y2="657" stroke="#ffffff" stroke-width="42" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="28" fill="#ffffff"/>
</svg>
