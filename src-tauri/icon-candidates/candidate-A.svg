<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a52"/>
      <stop offset="0.55" stop-color="#f23a24"/>
      <stop offset="1" stop-color="#d92b18"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a1208" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- 顶部玻璃高光 -->
  <rect x="64" y="48" width="896" height="420" rx="200" fill="url(#gloss)"/>
  <!-- 钟环 + 指针（柔影托底） -->
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="280" fill="none" stroke="#ffffff" stroke-width="46"/>
    <line x1="512" y1="512" x2="512" y2="332" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
    <line x1="512" y1="512" x2="668" y2="512" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="30" fill="#ffffff"/>
  </g>
</svg>
