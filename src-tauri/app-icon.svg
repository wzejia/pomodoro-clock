<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 基底：对角光，左上亮右下深 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b4d"/>
      <stop offset="0.5" stop-color="#ee3a20"/>
      <stop offset="1" stop-color="#c82311"/>
    </linearGradient>
    <!-- 左上大柔光：体积光 -->
    <radialGradient id="vol" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 菲涅尔边：沿对角衰减的边缘光 -->
    <linearGradient id="fresnel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- 顶部极浅 sheen：玻璃感浮在红色之上 -->
    <radialGradient id="sheen" cx="0.5" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部浅内阴影：纵深 -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#5a0500" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a0500" stop-opacity="0.18"/>
    </linearGradient>
    <!-- 右下内缘暗线：玻璃断面 -->
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.55" stop-color="#5a0500" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a0500" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a1005" flood-opacity="0.35"/>
    </filter>
    <clipPath id="shape"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="url(#vol)"/>
    <rect width="1024" height="1024" fill="url(#cut)"/>
    <ellipse cx="512" cy="120" rx="500" ry="280" fill="url(#sheen)"/>
    <rect width="1024" height="1024" fill="url(#floor)"/>
  </g>
  <!-- 菲涅尔边缘光 + 内侧次边缘光 -->
  <rect x="5" y="5" width="1014" height="1014" rx="227" fill="none" stroke="url(#fresnel)" stroke-width="8"/>
  <rect x="16" y="16" width="992" height="992" rx="216" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- glyph：计时环。轨道 24% 白 + 3/4 进度弧 95% 白圆头；先铺折射光晕再压主形 -->
  <g opacity="0.35" filter="url(#halo)">
    <path d="M 512 240 A 272 272 0 1 1 240 512" fill="none" stroke="#ffb9a6" stroke-width="56" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="272" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="56"/>
    <path d="M 512 240 A 272 272 0 1 1 240 512" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="56" stroke-linecap="round"/>
  </g>
  <!-- 进度弧前段镜面弧光（贴外缘） -->
  <path d="M 512 254 A 258 258 0 0 1 735 383" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>
</svg>
