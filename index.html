<!doctype html>
<html lang="zh-CN" data-theme="light" data-material="liquid_glass">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>番茄钟</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app" class="app mini" data-phase="work">
      <!-- 迷你胶囊 -->
      <div id="pill" class="pill">
        <span id="pill-phase" class="pill-phase">专注</span>
        <span id="pill-time" class="pill-time">25:00</span>
        <button id="btn-toggle-run" class="icon-btn" title="开始/暂停" aria-label="开始或暂停">
          <svg id="icon-play" viewBox="0 0 16 16" width="15" height="15"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
          <svg id="icon-pause" viewBox="0 0 16 16" width="15" height="15" style="display:none"><path d="M3.5 2.5h3.2v11H3.5zM9.3 2.5h3.2v11H9.3z" fill="currentColor"/></svg>
        </button>
        <!-- v11：胶囊底部 2px 进度条（snapshot remaining/total 驱动，前端不自算）；
             左右 26px inset = 胶囊底边平段弦长（半径38圆角外区域不可见） -->
        <div class="pill-progress" aria-hidden="true"><div id="pill-progress-bar"></div></div>
      </div>

      <!-- 展开面板 -->
      <div id="panel" class="panel">
        <header id="panel-head" class="panel-head">
          <div class="panel-timer">
            <div id="panel-phase" class="panel-phase">专注</div>
            <div id="panel-time" class="panel-time">25:00</div>
            <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
            <div id="cycle-dots" class="cycle-dots" aria-label="本组番茄进度"></div>
          </div>
        </header>

        <div class="controls">
          <button id="btn-primary" class="btn btn-primary">开始</button>
          <button id="btn-reset" class="btn">重置</button>
          <button id="btn-switch" class="btn btn-switch">
            <span class="switch-label">休息</span>
          </button>
        </div>

        <section class="stats">
          <div class="section-caption">统计</div>
          <div class="stat-cards">
            <div class="stat-card">
              <div id="stat-today-count" class="stat-num">0</div>
              <div class="stat-label">今日番茄</div>
            </div>
            <div class="stat-card">
              <div id="stat-today-min" class="stat-num">0</div>
              <div class="stat-label">专注分钟</div>
            </div>
            <div class="stat-card">
              <div id="stat-streak" class="stat-num">0</div>
              <div class="stat-label">连续天数</div>
            </div>
          </div>
          <div class="chart-head">
            <div class="seg-switch" role="group" aria-label="统计范围">
              <button id="range-week" class="seg-opt active">周</button>
              <button id="range-month" class="seg-opt">月</button>
            </div>
            <div class="chart-title-wrap">
              <button id="month-prev" class="month-nav" aria-label="上个月" hidden>‹</button>
              <span id="chart-title" class="chart-title">本周</span>
              <button id="month-next" class="month-nav" aria-label="下个月" hidden>›</button>
            </div>
            <div class="seg-switch" role="group" aria-label="统计单位">
              <button id="unit-count" class="seg-opt active">个数</button>
              <button id="unit-min" class="seg-opt">分钟</button>
            </div>
          </div>
          <div class="week-chart" id="week-chart" aria-label="本周每日番茄数"></div>
          <div class="month-chart" id="month-chart" aria-label="当月每日番茄热力" hidden></div>
        </section>

        <div class="panel-foot">
          <button id="btn-collapse" class="collapse-btn" aria-label="收起">
            <svg viewBox="0 0 12 7" width="12" height="7"><path d="M1 6l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- 设置抽屉：从右滑入覆盖面板 -->
        <div id="drawer" class="drawer">
          <div class="drawer-head">
            <button id="btn-drawer-back" class="icon-btn" aria-label="返回">
              <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="drawer-title">设置</span>
          </div>
          <section class="settings">
            <div class="section-caption">时长（分钟）</div>
            <div class="group-card">
              <div class="setting-row">
                <span>工作</span>
                <span class="stepper">
                  <button class="step-btn" data-step="work:-1" aria-label="减少">−</button>
                  <span class="stepper-val"><input id="input-work" type="number" inputmode="numeric" min="1" max="120" value="25" /></span>
                  <button class="step-btn" data-step="work:1" aria-label="增加">+</button>
                </span>
              </div>
              <div class="setting-row">
                <span>短休息</span>
                <span class="stepper">
                  <button class="step-btn" data-step="short:-1" aria-label="减少">−</button>
                  <span class="stepper-val"><input id="input-short" type="number" inputmode="numeric" min="1" max="60" value="5" /></span>
                  <button class="step-btn" data-step="short:1" aria-label="增加">+</button>
                </span>
              </div>
              <div class="setting-row">
                <span>长休息</span>
                <span class="stepper">
                  <button class="step-btn" data-step="long:-1" aria-label="减少">−</button>
                  <span class="stepper-val"><input id="input-long" type="number" inputmode="numeric" min="1" max="60" value="15" /></span>
                  <button class="step-btn" data-step="long:1" aria-label="增加">+</button>
                </span>
              </div>
            </div>
            <div class="section-caption">循环</div>
            <div class="group-card">
              <div class="setting-row">
                <span>长休间隔（个）</span>
                <span class="stepper">
                  <button class="step-btn" data-step="every:-1" aria-label="减少">−</button>
                  <span class="stepper-val"><input id="input-every" type="number" inputmode="numeric" min="2" max="10" value="4" /></span>
                  <button class="step-btn" data-step="every:1" aria-label="增加">+</button>
                </span>
              </div>
              <div class="setting-row toggle-row">
                <span>自动开始下一阶段</span>
                <button id="toggle-auto-start" class="toggle" role="switch" aria-checked="false">
                  <span class="toggle-knob"></span>
                </button>
              </div>
            </div>
            <div class="section-caption">外观</div>
            <div class="group-card">
              <div class="setting-row theme-row">
                <span>主题</span>
                <div class="theme-switch" role="group" aria-label="主题">
                  <button data-theme-opt="light" class="theme-opt active">浅色</button>
                  <button data-theme-opt="dark" class="theme-opt">深色</button>
                </div>
              </div>
              <div class="setting-row material-row">
                <span>材质</span>
                <div class="theme-switch" role="group" aria-label="材质">
                  <button data-material-opt="classic" class="material-opt">经典</button>
                  <button data-material-opt="liquid_glass" class="material-opt active">液态玻璃</button>
                </div>
              </div>
            </div>
            <!-- v11：快捷键改键（单行分组卡无标题=既有拍板先例）；键帽点击即录，× 一键关闭 -->
            <div class="group-card">
              <div class="setting-row hotkey-row">
                <span>快捷键</span>
                <span class="hotkey-ctl">
                  <button id="hotkey-cap" class="hotkey-cap" title="点击录制新快捷键">…</button>
                  <button id="hotkey-off" class="hotkey-off" title="关闭快捷键" aria-label="关闭快捷键">
                    <svg viewBox="0 0 10 10" width="9" height="9"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                  </button>
                </span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- 右键菜单（自绘苹果风，主题跟随 CSS 变量） -->
    <div id="ctx-menu" class="ctx-menu" role="menu" aria-hidden="true">
      <button id="ctx-settings" class="ctx-item" role="menuitem">设置…</button>
      <button id="ctx-autostart" class="ctx-item" role="menuitemcheckbox" aria-checked="false">开机自启</button>
      <button id="ctx-quit" class="ctx-item" role="menuitem">退出</button>
    </div>
  </body>
</html>
