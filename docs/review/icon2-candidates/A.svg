<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 基底：光源在上，红从亮橙红沉到深红 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a66"/>
      <stop offset="0.45" stop-color="#f64a2e"/>
      <stop offset="1" stop-color="#d92b18"/>
    </linearGradient>
    <!-- 底部内阴影：玻璃厚度感 -->
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#8c0f05" stop-opacity="0"/>
      <stop offset="1" stop-color="#8c0f05" stop-opacity="0.38"/>
    </linearGradient>
    <!-- 顶部镜面高光：液态玻璃的折射亮带 -->
    <radialGradient id="spec" cx="0.5" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 边缘光：顶亮侧弱底微 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <!-- 底部反弹光 -->
    <linearGradient id="bounce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc0a8" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffc0a8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="800">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe4dc"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8a1408" flood-opacity="0.4"/>
    </filter>
    <clipPath id="shape"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g clip-path="url(#shape)">
    <ellipse cx="512" cy="140" rx="480" ry="300" fill="url(#spec)"/>
    <rect width="1024" height="1024" fill="url(#innerShade)"/>
    <rect y="880" width="1024" height="144" fill="url(#bounce)"/>
  </g>
  <!-- 边缘光描边 -->
  <rect x="4" y="4" width="1016" height="1016" rx="228" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <!-- 白色时钟 glyph：玻璃质感渐变 + 柔影浮起 -->
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="272" fill="none" stroke="url(#glyph)" stroke-width="48"/>
    <line x1="512" y1="512" x2="512" y2="336" stroke="url(#glyph)" stroke-width="48" stroke-linecap="round"/>
    <line x1="512" y1="512" x2="664" y2="512" stroke="url(#glyph)" stroke-width="48" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="30" fill="url(#glyph)"/>
  </g>
</svg>
